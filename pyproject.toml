[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialchamp-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Social Champ API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Social Champ" }]
keywords = ["mcp", "model-context-protocol", "socialchamp", "social-media"]
dependencies = [
    "mcp>=1.9.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
socialchamp-mcp = "socialchamp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/socialchamp/socialchamp-mcp"
Documentation = "https://developers.socialchamp.com"

[tool.hatch.build.targets.wheel]
packages = ["src/socialchamp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
